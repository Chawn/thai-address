name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-data.mjs
  # Add one job per package (packages/js, packages/go, packages/dart) as they are created.
